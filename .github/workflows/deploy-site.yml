name: Deploy site (GitHub Pages)

# Publica o frontend (Vite) no GitHub Pages, com domínio budget.pkbhomes.com.
# Sem conta nova: usa o próprio GitHub. Roda a cada push no frontend, e pelo
# botão "Run workflow".

on:
  workflow_dispatch:
  push:
    branches: [main, claude/new-session-zkg2g6]   # branch default do repo
    paths: ['frontend/**', 'supabase/functions/_shared/field_manual.json']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19 (Playwright deps)
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      # the field page reads the PKB field manual (single source: supabase/functions/_shared)
      - run: cp ../supabase/functions/_shared/field_manual.json public/ops/field/manual.json
      # the field page works offline: serve the Supabase library from our own domain (cached by its service worker)
      - run: cp node_modules/@supabase/supabase-js/dist/umd/supabase.js public/ops/field/supabase.js
      - run: npm run build   # lê frontend/.env.production (URL + publishable key)

      # SPA fallback: GitHub Pages serve 404.html em rotas desconhecidas → app carrega e roteia.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19 (Playwright deps)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

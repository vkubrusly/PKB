name: PKB Ops — daily collection

# Twice a day, 6:00 AM and 1:00 PM Florida time: read Buildertrend jobs, collect the county portals for every
# permit still being monitored (ops.monitoring_queue: 'permit' until issued,
# 'inspections' until the CO), then load everything into Supabase.
#
# Secrets (GitHub → Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  already used by the other workflows
#   BT_COOKIES_JSON        the bot's Buildertrend session (Cookie-Editor → Export → JSON)
#   BOT_EMAIL_PASSWORD     Gmail app password of botpkbhomes@gmail.com (alerts)
# Variables: OPS_SEND_ENABLED = 'true' to send e-mails (otherwise drafts only)
#
# Schedules only run from the repository's default branch.

on:
  # GitHub cron is UTC and Florida changes clocks, so each run has a summer (EDT) and a
  # winter (EST) slot; the gate job below keeps only the one that matches today's offset.
  schedule:
  # Off the hour on purpose (GitHub delays :00 schedules the most) and a bit early, so the data
  # is ready around 6 AM / 1 PM. If GitHub is still late, ops-mail's watchdog starts the round.
    - cron: '47 9 * * *'    # 05:47 EDT
    - cron: '47 10 * * *'   # 05:47 EST
    - cron: '47 16 * * *'   # 12:47 EDT
    - cron: '47 17 * * *'   # 12:47 EST
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max permits per portal/stage (blank = all)'
        required: false
      test_email:
        description: 'Send one test e-mail to this address first (checks the Gmail app password)'
        required: false

concurrency: { group: ops-daily, cancel-in-progress: false }

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs: { run: '${{ steps.g.outputs.run }}' }
    steps:
      - id: g
        env: { CRON: '${{ github.event.schedule }}' }
        run: |
          # Manual runs always go. Scheduled: EDT (-0400) keeps the 9/16 UTC slots, EST the 10/17 ones.
          if [ -z "$CRON" ]; then echo run=true >> "$GITHUB_OUTPUT"; exit 0; fi
          hour=$(echo "$CRON" | awk '{print $2}')
          if [ "$(TZ=America/New_York date +%z)" = "-0400" ]; then ok="9 16"; else ok="10 17"; fi
          case " $ok " in *" $hour "*) echo run=true ;; *) echo run=false ;; esac >> "$GITHUB_OUTPUT"

  collect:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults: { run: { working-directory: ops } }
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      BT_COOKIES_FILE: ${{ github.workspace }}/bt_cookies.json
      OPS_ALWAYS_CC: guilherme@pkbhomes.com   # copied on every e-mail that leaves PKB (internal alerts opt out)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: ops/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Test e-mail
        if: ${{ inputs.test_email != '' && inputs.test_email != null }}
        continue-on-error: true   # a bad mail password must not stop the collection
        env:
          BOT_EMAIL: ${{ secrets.BOT_EMAIL || 'botpkbhomes@gmail.com' }}
          BOT_EMAIL_PASSWORD: ${{ secrets.BOT_EMAIL_PASSWORD }}
          OPS_SEND_ENABLED: ${{ vars.OPS_SEND_ENABLED || 'false' }}
        run: node notify/test_email.mjs "${{ inputs.test_email }}"

      - name: Buildertrend session
        env: { BT_COOKIES_JSON: '${{ secrets.BT_COOKIES_JSON }}' }
        run: |
          if [ -z "$BT_COOKIES_JSON" ]; then echo "::warning::BT_COOKIES_JSON not set — Buildertrend steps will be skipped"; exit 0; fi
          printf '%s' "$BT_COOKIES_JSON" > "$BT_COOKIES_FILE"

      - name: Buildertrend session check
        id: bt
        continue-on-error: true
        env:
          BOT_EMAIL: ${{ secrets.BOT_EMAIL || 'botpkbhomes@gmail.com' }}
          BOT_EMAIL_PASSWORD: ${{ secrets.BOT_EMAIL_PASSWORD }}
          OPS_SEND_ENABLED: ${{ vars.OPS_SEND_ENABLED || 'false' }}
        run: echo "state=$(node rules/bt_session.mjs | head -1)" >> "$GITHUB_OUTPUT"

      - name: Buildertrend jobs and custom fields
        if: steps.bt.outputs.state == 'ok'
        continue-on-error: true   # an expired session must not block the portal run
        run: |
          [ -f "$BT_COOKIES_FILE" ] || exit 0
          node collectors/buildertrend/list_jobs.mjs > /dev/null
          node collectors/buildertrend/job_fields.mjs

      - name: Buildertrend photos
        if: steps.bt.outputs.state == 'ok'
        continue-on-error: true
        run: |
          [ -f "$BT_COOKIES_FILE" ] || exit 0
          node collectors/buildertrend/photos.mjs && node scripts/load_photos.mjs

      # Every Daily Log with its author and time (ops.daily_logs). The first run, with the table
      # empty, imports the whole history; afterwards the last 30 days are re-read. Read-only.
      - name: Buildertrend Daily Logs (who wrote each one)
        if: steps.bt.outputs.state == 'ok'
        continue-on-error: true
        run: |
          [ -f "$BT_COOKIES_FILE" ] || exit 0
          node collectors/buildertrend/daily_logs.mjs $(node scripts/load_daily_logs.mjs --span) && node scripts/load_daily_logs.mjs

      - name: County portals (queue-driven)
        continue-on-error: true
        run: node scripts/collect_all.mjs ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}

      - name: Load into Supabase
        run: |
          node scripts/build_seed.mjs --parts
          node scripts/apply_seed.mjs
          node scripts/permit_office.mjs

      # Each permit's own inspection list from the county portal (EnerGov); Citrus lists
      # every required inspection on the permit already. Drives the progress/next steps.
      - name: Inspection plans per permit
        continue-on-error: true
        run: node collectors/energov/inspection_plan.mjs

      # R-INSP-FAIL: e-mail supervisor/PMs/Cristiano about new failed inspections (with the
      # inspector's comments) and queue a Buildertrend Daily Log. Sends only when the repo
      # variable OPS_SEND_ENABLED is 'true'; otherwise every message is stored as a draft.
      # R4 permit issued (team + Cristiano; Daniela fees, Guilherme Cc), R8 inspection passed
      # (next inspection + the field-manual work before it), R5 new holds, R6 weekly digest
      # (Mondays only; the script checks the day).
      - name: Rules — failed/passed inspections, permits issued, holds, idle jobs, weekly digest
        continue-on-error: true
        env:
          BOT_EMAIL: ${{ secrets.BOT_EMAIL || 'botpkbhomes@gmail.com' }}
          BOT_EMAIL_PASSWORD: ${{ secrets.BOT_EMAIL_PASSWORD }}
          OPS_SEND_ENABLED: ${{ vars.OPS_SEND_ENABLED || 'false' }}
        run: |
          node rules/inspection_failed.mjs || echo "::warning::rules/inspection_failed.mjs failed"
          node rules/inspection_passed.mjs || echo "::warning::rules/inspection_passed.mjs failed"
          node rules/review_log.mjs || echo "::warning::rules/review_log.mjs failed"
          node rules/permit_issued.mjs || echo "::warning::rules/permit_issued.mjs failed"
          node rules/holds.mjs || echo "::warning::rules/holds.mjs failed"
          node rules/job_idle.mjs || echo "::warning::rules/job_idle.mjs failed"
          node rules/weekly_digest.mjs || echo "::warning::rules/weekly_digest.mjs failed"

      # R1/R2: corrections e-mail to Sovereign (Guilherme in Cc) and follow-ups after
      # 2 business days per failed item. Leaves PKB, so it runs only when the repository
      # variable OPS_R1_ENABLED is 'true'.
      - name: Rules — corrections to the designer (R1/R2)
        if: vars.OPS_R1_ENABLED == 'true'
        continue-on-error: true
        env:
          BOT_EMAIL: ${{ secrets.BOT_EMAIL || 'botpkbhomes@gmail.com' }}
          BOT_EMAIL_PASSWORD: ${{ secrets.BOT_EMAIL_PASSWORD }}
          OPS_SEND_ENABLED: ${{ vars.OPS_SEND_ENABLED || 'false' }}
        run: node rules/corrections.mjs

      # Queued Buildertrend Daily Logs (e.g. failed inspections). Writes to Buildertrend,
      # so it runs only when the repository variable OPS_BT_POST is 'true'.
      - name: Buildertrend Daily Logs
        if: steps.bt.outputs.state == 'ok' && vars.OPS_BT_POST == 'true'
        continue-on-error: true
        env: { OPS_BT_POST: 'true' }
        run: |
          node rules/post_bt_logs.mjs || echo "::warning::post_bt_logs failed"
          node rules/post_bt_leads.mjs || echo "::warning::post_bt_leads failed"

      # Portal data for budget.pkbhomes.com/ops/ (ops.snapshots, read by the page and the Ask).
      - name: Portal snapshot
        continue-on-error: true
        run: node scripts/board_snapshot.mjs

      - name: Keep the raw snapshots (7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ops-snapshots
          path: |
            ops/data/portal
            ops/data/buildertrend/job_fields.json
          retention-days: 7

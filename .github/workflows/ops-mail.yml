name: PKB Ops — read bot mailbox

# Every hour: read new messages in botpkbhomes@gmail.com, store them in ops.inbound_emails
# (classified and linked to the job), turn Buildertrend activity into ops.events, and mark
# the messages read. Manual run with backfill=true reads the whole inbox once.
# Then R-LEAD: website work requests are chased with the permits owner (24 h, then every 48 h)
# until he answers or the job appears in the spreadsheet / Buildertrend.

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Read every message in the inbox (not only unread)'
        type: boolean
        default: false

concurrency: { group: ops-mail, cancel-in-progress: false }

jobs:
  read:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19 (Playwright deps)
    timeout-minutes: 15
    defaults: { run: { working-directory: ops } }
    steps:
      - uses: actions/checkout@v4
      - name: Read mailbox
        env:
          BOT_EMAIL: ${{ secrets.BOT_EMAIL || 'botpkbhomes@gmail.com' }}
          BOT_EMAIL_PASSWORD: ${{ secrets.BOT_EMAIL_PASSWORD }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 collectors/mail/collect_mail.py ${{ inputs.backfill && '--all' || '' }}

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: ops/package-lock.json }
      - run: npm ci --omit=optional
        env: { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1' }
      - name: Rules — website work requests (R-LEAD), start licensing (R0), septic from e-mail, e-mails approved in the portal
        continue-on-error: true
        env:
          BOT_EMAIL: ${{ secrets.BOT_EMAIL || 'botpkbhomes@gmail.com' }}
          BOT_EMAIL_PASSWORD: ${{ secrets.BOT_EMAIL_PASSWORD }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          OPS_SEND_ENABLED: ${{ vars.OPS_SEND_ENABLED || 'false' }}
        run: |
          node rules/lead_followup.mjs || echo "::warning::rules/lead_followup.mjs failed"
          node rules/start_licensing.mjs || echo "::warning::rules/start_licensing.mjs failed"
          node rules/septic_mail.mjs || echo "::warning::rules/septic_mail.mjs failed"
          node rules/send_approved.mjs || echo "::warning::rules/send_approved.mjs failed"

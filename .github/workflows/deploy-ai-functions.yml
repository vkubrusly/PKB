name: Deploy AI functions

# Publica as Edge Functions de IA no Supabase automaticamente.
# Roda ao dar push em supabase/functions/**, e também pelo botão "Run workflow".
#
# Secrets necessários (GitHub → Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  → supabase.com/dashboard/account/tokens
#   ANTHROPIC_API_KEY      → console.anthropic.com
# (o project ref é público e fica fixo abaixo)

on:
  workflow_dispatch:
  push:
    branches: [main, claude/new-session-zkg2g6]   # branch default do repo
    paths: ['supabase/functions/**', 'supabase/config.toml']

env:
  PROJECT_REF: fvjknahpmihueyeasgbx

jobs:
  deploy:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19 (Playwright deps)
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # Install the Supabase CLI via npx (avoids the flaky setup-cli action
      # download from codeload.github.com, which has been 429/503-ing).
      # The ANTHROPIC_API_KEY secret is already set from earlier deploys; re-setting
      # it needs project-admin scope. Keep it best-effort so a token that can deploy
      # functions but not manage secrets (or an unchanged key) doesn't abort the job.
      - name: Set Claude API key (função secret, best-effort)
        continue-on-error: true
        run: npx --yes supabase@latest secrets set ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" --project-ref "$PROJECT_REF" || echo "secret unchanged / insufficient privilege — continuing to deploy"

      # The bot mailbox for ops-users (access links). Set through the Management API with the same token.
      - name: Set bot mailbox secrets (best-effort)
        continue-on-error: true
        env: { BOT_EMAIL_PASSWORD: '${{ secrets.BOT_EMAIL_PASSWORD }}' }
        run: |
          [ -n "$BOT_EMAIL_PASSWORD" ] || { echo "BOT_EMAIL_PASSWORD not set in GitHub"; exit 0; }
          jq -n --arg p "$BOT_EMAIL_PASSWORD" '[{name:"BOT_EMAIL",value:"botpkbhomes@gmail.com"},{name:"BOT_EMAIL_PASSWORD",value:$p}]' \
            | curl -sS -o /dev/null -w "secrets: HTTP %{http_code}\n" -X POST -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
              --data @- "https://api.supabase.com/v1/projects/$PROJECT_REF/secrets"

      - name: Deploy functions
        run: |
          SB="npx --yes supabase@latest"
          $SB functions deploy takeoff         --project-ref "$PROJECT_REF" --yes
          $SB functions deploy price-search    --project-ref "$PROJECT_REF" --yes
          $SB functions deploy product-detail  --project-ref "$PROJECT_REF" --yes
          $SB functions deploy project-extract --project-ref "$PROJECT_REF" --yes
          $SB functions deploy materials-extract --project-ref "$PROJECT_REF" --yes
          $SB functions deploy estimate-market --project-ref "$PROJECT_REF" --yes
          $SB functions deploy county-costs --project-ref "$PROJECT_REF" --yes
          $SB functions deploy market-research --project-ref "$PROJECT_REF" --yes
          $SB functions deploy team --project-ref "$PROJECT_REF" --yes
          $SB functions deploy ops-ask --project-ref "$PROJECT_REF" --yes
          $SB functions deploy ops-field --project-ref "$PROJECT_REF" --yes
          $SB functions deploy ops-users --project-ref "$PROJECT_REF" --yes

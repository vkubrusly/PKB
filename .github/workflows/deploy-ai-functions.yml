name: Deploy AI functions

# Publica as Edge Functions de IA no Supabase automaticamente.
# Roda ao dar push em supabase/functions/**, e também pelo botão "Run workflow".
#
# Secrets necessários (GitHub → Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  → supabase.com/dashboard/account/tokens
#   ANTHROPIC_API_KEY      → console.anthropic.com
# (o project ref é público e fica fixo abaixo)

on:
  workflow_dispatch:
  push:
    branches: [main, claude/new-session-zkg2g6]   # branch default do repo
    paths: ['supabase/functions/**', 'supabase/config.toml']

env:
  PROJECT_REF: fvjknahpmihueyeasgbx

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # Install the Supabase CLI via npx (avoids the flaky setup-cli action
      # download from codeload.github.com, which has been 429/503-ing).
      - name: Set Claude API key (função secret)
        run: npx --yes supabase@latest secrets set ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" --project-ref "$PROJECT_REF"

      - name: Deploy functions
        run: |
          SB="npx --yes supabase@latest"
          $SB functions deploy takeoff         --project-ref "$PROJECT_REF"
          $SB functions deploy price-search    --project-ref "$PROJECT_REF"
          $SB functions deploy product-detail  --project-ref "$PROJECT_REF"
          $SB functions deploy project-extract --project-ref "$PROJECT_REF"
          $SB functions deploy materials-extract --project-ref "$PROJECT_REF"
          $SB functions deploy estimate-market --project-ref "$PROJECT_REF"
          $SB functions deploy county-costs --project-ref "$PROJECT_REF"
          $SB functions deploy market-research --project-ref "$PROJECT_REF"
          $SB functions deploy team --project-ref "$PROJECT_REF"

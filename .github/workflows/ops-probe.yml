name: PKB Ops — portal probe

# One-off diagnostics for a portal that needs a login (credentials live only in
# GitHub secrets). Prints what the portal shows; never prints the credentials.
on:
  workflow_dispatch:
    inputs:
      probe:
        description: 'Probe to run'
        type: choice
        options: [fasttrack, fasttrack-collect, fasttrack-reports, lake, buildertrend, buildertrend-schedule, buildertrend-schedule-api, bt-schedule-rule]
        default: fasttrack
      arg:
        description: 'Optional argument (e.g. permit number)'
        required: false

jobs:
  probe:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19 (Playwright deps)
    timeout-minutes: 20
    defaults: { run: { working-directory: ops } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: ops/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Buildertrend session
        if: startsWith(inputs.probe, 'buildertrend') || startsWith(inputs.probe, 'bt-')
        env: { BT_COOKIES_JSON: '${{ secrets.BT_COOKIES_JSON }}' }
        run: printf '%s' "$BT_COOKIES_JSON" > "$GITHUB_WORKSPACE/bt_cookies.json"
      - name: Run probe
        env:
          BT_COOKIES_FILE: ${{ github.workspace }}/bt_cookies.json
          SUPABASE_ACCESS_TOKEN: ${{ inputs.probe == 'bt-schedule-rule' && secrets.SUPABASE_ACCESS_TOKEN || '' }}
          ORANGE_PORTAL_USER: ${{ secrets.ORANGE_PORTAL_USER }}
          ORANGE_PORTAL_PASS: ${{ secrets.ORANGE_PORTAL_PASS }}
          ORANGE_PORTAL_USER_2: ${{ secrets.ORANGE_PORTAL_USER_2 }}
          ORANGE_PORTAL_PASS_2: ${{ secrets.ORANGE_PORTAL_PASS_2 }}
        run: |
          if [ "${{ inputs.probe }}" = fasttrack-collect ]; then
            # Fast Track collector dry run: collect, then print the normalized JSON (no database write).
            node collectors/fasttrack/collect.mjs --county orange ${{ inputs.arg }} && cat data/portal/orange/*.json
          elif [ "${{ inputs.probe }}" = bt-schedule-rule ]; then
            # rules/bt_schedule.mjs — dry run unless the argument has --post (e.g. "--job 0031 --limit 1 --post")
            node rules/bt_schedule.mjs ${{ inputs.arg }}
          elif [ "${{ inputs.probe }}" = buildertrend-schedule-api ]; then
            node collectors/buildertrend/schedule_api_probe.mjs ${{ inputs.arg }}
          elif [ "${{ inputs.probe }}" = buildertrend-schedule ]; then
            node collectors/buildertrend/schedule_probe.mjs ${{ inputs.arg }}
          elif [ "${{ inputs.probe }}" = fasttrack-reports ]; then
            node collectors/fasttrack/probe_reports.mjs ${{ inputs.arg }}
          else
            node collectors/${{ inputs.probe }}/probe.mjs ${{ inputs.arg }}
          fi

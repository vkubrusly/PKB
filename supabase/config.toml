# Supabase local config. See https://supabase.com/docs/guides/cli/config
project_id = "pkb-orcamentos"

[db]
port = 54322
# Supabase Postgres images are 15/17 (16 was skipped); the CLI rejects 16.
# Local/validation only — CI deploys Edge Functions and never pushes the DB.
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[api]
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
